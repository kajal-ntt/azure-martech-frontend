name: Build and deploy Node.js app to Azure Web App - martech-frontend
on:
  push:
    branches:
      - azure-deploy
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Debug sign-in file
        run: head -40 app/sign-in/page.tsx
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: Clear Next.js cache
        run: rm -rf .next
      - name: npm install and build
        run: |
          npm install
          npm run build -- --no-turbo 2>/dev/null || npm run build
        env:
          NEXT_PUBLIC_API_URL: https://martech-ddbhddg9eef9e8gv.centralindia-01.azurewebsites.net
          NEXT_PUBLIC_APP_URL: https://martech-frontend-c0are2h4bkanbmhq.centralindia-01.azurewebsites.net
          NEXT_PUBLIC_AGENT_API_URL: https://your-agents-app.azurewebsites.net/api/v1
          NEXT_TELEMETRY_DISABLED: 1
          TURBOPACK: 0
         
      - name: Prepare deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'martech-frontend'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C245CC7EA3954775A703D18AF0B6838E }}
